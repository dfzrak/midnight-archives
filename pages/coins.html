// ==== Network ====
function ajax(m,u,b,cb){
 var x=new XMLHttpRequest();x.open(m,u,true);
 x.setRequestHeader('Authorization','Bearer '+T);
 x.setRequestHeader('Accept','application/vnd.github.v3+json');
 if(b){x.setRequestHeader('Content-Type','application/json')}
 x.onload=function(){if(x.status>=200&&x.status<300)try{cb(null,JSON.parse(x.responseText))}catch(e){cb(e)}else cb(new Error(x.status))};
 x.onerror=function(){cb(new Error('net'))};
 x.send(b?JSON.stringify(b):null);
}

function fUsers(cb){
 ajax('GET',A+'?t='+Date.now(),null,function(e,d){
  if(e){cb(e);return}
  sh=d.sha;
  try{var u=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(d.content.replace(/\n/g,'')),function(c){return c.charCodeAt(0)})));all=u.users||{};cb(null)}catch(e2){cb(e2)}
 });
}

function sUsers(msg,cb){
 var ud={users:all,last_updated:new Date().toISOString()};
 var raw=JSON.stringify(ud,null,2);
 var b64=btoa(String.fromCharCode(...new TextEncoder().encode(raw)));
 ajax('PUT',A,{message:msg||'update',content:b64,sha:sh},function(e,d){
  if(e){cb(e);return}
  sh=d.content?d.content.sha:d.sha;cb(null);
 });
}

// ==== Device ====
function genDeviceToken(){return 'dt_'+Math.random().toString(36).substring(2,16)+Date.now().toString(36);}
function getDeviceToken(){try{var t=localStorage.getItem(DK);if(!t){t=genDeviceToken();localStorage.setItem(DK,t);}return t;}catch(e){return genDeviceToken();}}

// ==== User ====
function vName(n){return n.replace(/<[^>]*>/g,'').replace(/[^\u4e00-\u9fa5a-zA-Z0-9_\-]/g,'').trim().substring(0,20);}

function toast(m,d){d=d||2500;var e=document.querySelector('.toast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';setTimeout(function(){t.remove()},300)},d)}

function updateBalanceDOM(){
 var be=document.getElementById('bal');
 if(!be)return;
 be.textContent=coin;
 be.classList.add('flash');

}

// ==== Spend ====
function spend(am,desc,cb){
 _lastSpend=Date.now();
 coin=Math.max(0,coin-am);
 updateBalanceDOM();
 updSvc();
 fUsers(function(e){
  if(e){coin+=am;updateBalanceDOM();updSvc();cb(false);return}
  if(!all[me]){coin+=am;updateBalanceDOM();updSvc();cb(false);return}
  all[me].coins=Math.max(0,(all[me].coins||0)-am);
  if(!all[me].transactions)all[me].transactions=[];
  all[me].transactions.push({amount:-am,desc:desc,time:new Date().toISOString()});
  all[me].transactions=all[me].transactions.slice(-30);
  var serverCoin=all[me].coins;
  sUsers(me+'消费',function(e2){
   if(e2){coin=serverCoin;updateBalanceDOM();updSvc();}
   // Always call cb(true) so UI proceeds — server sync failure handled silently
   cb(true);
  });
 });
}

 rev.push(HA.indexOf(p));try{localStorage.setItem('mr',JSON.stringify(rev))}catch(e){}

}

}
