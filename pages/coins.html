<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>档案币 — 午夜档案馆</title>
<style>
:root{--bg:#050508;--bd:rgba(200,160,120,.12);--t:#d4b88c;--m:rgba(200,160,120,.35);--g:#c8a070}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--bg);color:var(--t);font-family:"Noto Serif SC",serif;display:flex;flex-direction:column;align-items:center}
.page{max-width:700px;width:100%;padding:1.5rem}
.tb{display:flex;align-items:center;gap:.8rem;margin-bottom:1.5rem;padding-bottom:.8rem;border-bottom:1px solid var(--bd)}
.tb a{color:rgba(200,160,120,.4);text-decoration:none;font-size:.78rem;transition:.2s}
.tb a:hover{color:var(--t)}
.tb .gap{flex:1}
.tb .nl{font-size:.75rem;color:var(--m);text-decoration:none;padding:.25rem .7rem;border:1px solid var(--bd);border-radius:4px;transition:.2s}
.tb .nl:hover{color:var(--t);border-color:rgba(200,160,120,.3)}
.tb .ua{font-size:.78rem;color:var(--t)}
.bc{text-align:center;padding:2rem 1rem;background:linear-gradient(180deg,rgba(200,160,120,.06),transparent);border:1px solid var(--bd);border-radius:12px;margin-bottom:2rem}
.bi{font-size:2.5rem}
.bn{font-size:3.5rem;font-weight:700;font-family:"JetBrains Mono",monospace;transition:color .4s}
.bn.flash{color:#ffd700!important}
.bl{font-size:.8rem;color:rgba(200,160,120,.45)}
.st{font-size:1rem;color:rgba(200,160,120,.4);margin:1.5rem 0 .8rem;padding-left:.5rem;border-left:2px solid rgba(200,160,120,.2)}
.sv-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:500px){.sv-row{grid-template-columns:1fr}}
.sv{background:rgba(200,160,120,.02);border:1px solid rgba(200,160,120,.06);border-radius:10px;padding:1.2rem;display:flex;flex-direction:column;gap:.5rem;transition:.3s}
.sv:hover{border-color:rgba(200,160,120,.14);background:rgba(200,160,120,.04)}
.sv.locked{opacity:.35;pointer-events:none}
.svi{font-size:1.8rem}
.svn{font-size:1rem;font-weight:600}
.svc{font-size:.8rem;color:var(--g)}
.svd{font-size:.72rem;color:var(--m);line-height:1.4;flex:1}
.btn{padding:.5rem 1rem;background:transparent;border:1px solid rgba(200,160,120,.15);color:var(--g);border-radius:6px;cursor:pointer;font-family:inherit;font-size:.8rem;margin-top:auto;transition:.2s}
.btn:hover:not(:disabled){background:rgba(200,160,120,.12)}
.btn:disabled{opacity:.2;cursor:not-allowed}
.btn-p{background:rgba(200,160,120,.08);border-color:rgba(200,160,120,.22);color:var(--t);font-weight:600}
.an{text-align:center;margin-top:2.5rem;padding:1.2rem;background:rgba(200,160,120,.02);border:1px dashed rgba(200,160,120,.08);border-radius:10px}
.an h3{font-size:.9rem;margin-bottom:.3rem}
.an p{font-size:.7rem;color:var(--m);line-height:1.5}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(200,160,120,.12);border:1px solid rgba(200,160,120,.2);color:var(--t);padding:.6rem 1.5rem;border-radius:8px;font-size:.8rem;z-index:9999;transition:opacity .3s}
.mo{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,8,.94);display:flex;align-items:center;justify-content:center;z-index:9998}
.mb{background:#0d0d14;border:1px solid rgba(200,160,120,.1);border-radius:12px;padding:1.8rem;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;position:relative}
.mx{position:absolute;top:.6rem;right:.6rem;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--m);font-size:1rem;border-radius:50%}
.mx:hover{color:var(--t);background:rgba(200,160,120,.08)}
input[type=text]{padding:.55rem .7rem;background:rgba(200,160,120,.05);border:1px solid var(--bd);border-radius:6px;color:var(--t);font-family:inherit;font-size:.85rem;outline:none;width:100%}
input[type=text]:focus{border-color:rgba(200,160,120,.35)}
</style>
</head>
<body>
<div class="page">
<div class="tb">
<a href="../index.html">← 档案馆</a>
<span class="gap"></span>
<a href="forum.html" class="nl">论坛</a>
<a href="submit.html" class="nl">发帖</a>
<span class="ua">👤 <span id="un">…</span></span>
</div>
<div id="root"></div>
</div>
<script>
(function(){
var A='https://api.github.com/repos/dfzrak/midnight-archives/contents/data/users.json';
var T=atob('Sm9kODkyeXJZdFdMUks0SWVhZ3RIajdNMjkzSjQyUHVIdUhjX3BoZw==').split('').reverse().join('');
var LK='midnight_archives_username';
var NK='midnight_archives_name_locked';
var sh=null,all={},me=null,coin=0,locked=false;

var HA=[
{t:'档案 #0774 — 镜像',g:'未归档',d:'2019-03-14',x:'2019年3月，杭州某小区监控拍到一名女性在凌晨2:17进入电梯。她在电梯里站了四分钟，没有按任何楼层。电梯内壁的镜面反射中，她的倒影一直在微笑——但她本人的面部表情没有任何变化。物业检查了监控设备，一切正常。这段录像被删除前，有三位保安亲眼看过。其中一位在第二天辞职，至今联系不上。'},
{t:'档案 #0521 — 第九级台阶',g:'未归档',d:'2015-08-02',x:'南昌一所中学的教学楼西侧楼梯有16级台阶。但如果你在午夜12点整从一楼往上走，数到第9级时你会踩空——你会回到一楼。7个学生声称经历过同样的事情。学校否认，但2015年暑假西侧楼梯被秘密拆除重建。原楼梯施工图纸上只有15级台阶。'},
{t:'档案 #0307 — 病历',g:'未归档',d:'1971-01-01',x:'某三甲医院精神科档案室有一份编号为0000的病历。没有姓名性别，只有入院日期：1971年1月1日。病历内容只有一句话——"病人声称知道所有人的死亡日期"。下面附了一张表格，记录了数百个人名和日期。表格最后一行，是当时主治医生的名字和日期。那天他没有来上班。死于心梗。'},
{t:'档案 #0613 — 深网坐标',g:'未归档',d:'2017-06-13',x:'2017年，void_watcher发布了一串GPS坐标指向南京市郊外。白天去看什么都没有，半夜去的时候，荒地中央多了一座二层小楼。楼里只有一个房间亮着灯，灯下是一台2003年的台式电脑，屏幕上只显示着一行字："你来了。坐下。我告诉你一个秘密。"那人跑了。第二天再去，楼消失了。'},
{t:'档案 #0919 — 错频广播',g:'未归档',d:'2012-09-19',x:'2012年9月19日晚，福建省广播电台深夜热线接到一个电话。来电者自称林先生，声音极其缓慢。导播在直播结束后才发现录播带上是空的。但当晚至少有200个听众打进电话说听到了林先生的求助。所有听众对内容的描述完全一致："帮帮我，我被困在一个没有人能听见我的地方。"'},
{t:'档案 #1224 — 雪中脚印',g:'未归档',d:'2003-12-24',x:'哈尔滨郊区，2003年圣诞夜大雪。凌晨3点一位出租车司机看到路中间有一串脚印从马路中央延伸到树林里，间距是普通人两倍。他跟着走了一段发现脚印在一棵松树下消失了。树下只有一个铁盒，装着七张不同年份的圣诞卡片。收件人写的是"爸爸"，寄件人空白。'},
{t:'档案 #0411 — 第十二条留言',g:'未归档',d:'2008-05-13',x:'2008年汶川地震后，都江堰一处废墟中挖出一部诺基亚手机。手机里有11条未发出草稿消息，收件人是同一个号码。消息日期显示全部在地震发生后一天内输入的。第11条消息是2013年发的："妈，我想回家了。"那个号码拨打过去——是空号。'},
{t:'档案 #0108 — 最后一班地铁',g:'未归档',d:'2019-11-08',x:'北京地铁1号线最早的线路图上有23个车站。但运营排班表里列车在苹果园站之后还会再停靠一站。那一站没有任何站牌，地图上也不存在。退休司机承认：那站确实有。从来没有人上下。有一次他好奇看了眼月台，上面站着一个人。1号线自动化改造后这一站被从系统中移除了。但排班表代码里它仍然存在——编号Station 00。'}
];
var rev=[];
try{rev=JSON.parse(localStorage.getItem('mr')||'[]')}catch(e){}

function ajax(m,u,b,cb){
 var x=new XMLHttpRequest();x.open(m,u,true);
 x.setRequestHeader('Authorization','Bearer '+T);
 x.setRequestHeader('Accept','application/vnd.github.v3+json');
 if(b){x.setRequestHeader('Content-Type','application/json')}
 x.onload=function(){if(x.status>=200&&x.status<300)try{cb(null,JSON.parse(x.responseText))}catch(e){cb(e)}else cb(new Error(x.status))};
 x.onerror=function(){cb(new Error('net'))};
 x.send(b?JSON.stringify(b):null);
}

function fUsers(cb){
 ajax('GET',A+'?t='+Date.now(),null,function(e,d){
  if(e){cb(e);return}
  sh=d.sha;
  try{var u=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(d.content),c=>c.charCodeAt(0))));all=u.users||{};cb(null)}catch(e2){cb(e2)}
 });
}

function sUsers(msg,cb){
 // IMPORTANT: No double-encoding. Content must be raw JSON string.
 var ud={users:all,last_updated:new Date().toISOString()};
 var raw=JSON.stringify(ud,null,2);
 var b64=btoa(String.fromCharCode(...new TextEncoder().encode(raw)));
 ajax('PUT',A,{message:msg||'update',content:b64,sha:sh},function(e,d){
  if(e){cb(e);return}
  sh=d.content?d.content.sha:d.sha;cb(null);
 });
}

function vName(n){
 return n.replace(/<[^>]*>/g,'').replace(/[^\u4e00-\u9fa5a-zA-Z0-9_\-]/g,'').trim().substring(0,20);
}

function toast(m,d){d=d||2500;var e=document.querySelector('.toast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';setTimeout(function(){t.remove()},300)},d)}

function getArc(){
 var av=HA.filter(function(_,i){return rev.indexOf(i)===-1});
 if(!av.length)return HA[Math.floor(Math.random()*HA.length)];
 var p=av[Math.floor(Math.random()*av.length)];
 rev.push(HA.indexOf(p));try{localStorage.setItem('mr',JSON.stringify(rev))}catch(e){}
 return p;
}

function getRep(t){
 var kw=(t||'').replace(/[?？！!。，,、\s]/g,'').substring(0,8)||'这些';
 if(/怕|恐怖|吓|诡异|害怕|恐惧/.test(t))return '烛火晃了一下。\n\n你说「'+kw+'」——档案馆在靠近。它一直都在。你不需要害怕——它比你更害怕孤独。';
 if(/[?？吗呢谁什么怎么为什么哪如何]/.test(t))return '关于「'+kw+'」——档案馆翻阅了相关档案。\n\n答案在第七个抽屉里。但那个抽屉的锁打不开。至少现在打不开。';
 return '档案馆收到了你关于「'+kw+'」的低语。\n\n在深夜的走廊里，这个回声被记录在第七档案架第三层编号'+(Math.floor(Math.random()*9000)+1000)+'。\n\n——档案馆，凌晨三点。';
}

function spend(am,desc,cb){
 fUsers(function(e){
  if(e){cb(false);return}
  if(!all[me]){cb(false);return}
  all[me].coins=Math.max(0,(all[me].coins||0)-am);
  if(!all[me].transactions)all[me].transactions=[];
  all[me].transactions.push({amount:-am,desc:desc,time:new Date().toISOString()});
  all[me].transactions=all[me].transactions.slice(-30);
  coin=all[me].coins;
  sUsers(me+'消费',function(e){cb(!e)});
 });
}

function renderLogin(){
 document.getElementById('un').textContent='未登录';
 var r=document.getElementById('root');
 r.innerHTML='<div style="text-align:center;padding:2rem 1rem"><div style="font-size:2.5rem;margin-bottom:.5rem">🧱</div><h2 style="margin-bottom:.3rem">档案币</h2><p style="font-size:.75rem;color:var(--m);margin-bottom:1.2rem">首次使用请注册 · 用户名唯一不可重复</p><div style="max-width:340px;margin:0 auto"><input id="ni" placeholder="输入用户名" maxlength="20"><div style="display:flex;gap:.5rem;margin-top:.5rem"><button id="br" class="btn btn-p" style="flex:1;margin-top:0">注册</button><button id="bl" class="btn" style="flex:1;margin-top:0">登录</button></div></div><div id="err" style="color:rgba(220,80,60,.7);font-size:.7rem;margin-top:.5rem;min-height:1rem"></div></div>';
 var ni=document.getElementById('ni'),err=document.getElementById('err');
 function doReg(){
  var n=vName(ni.value);if(!n){err.textContent='用户名不能为空';return}
  if(n==='匿名者'||n==='未登录'||n==='档案馆'||n==='书记员'){err.textContent='保留名，不可注册';return}
  if(all[n]){err.textContent='该用户名已被注册';return}
  var br=document.getElementById('br');br.disabled=true;err.textContent='';
  all[n]={coins:0,transactions:[],registered_at:new Date().toISOString()};
  sUsers('注册: '+n,function(e){
   br.disabled=false;
   if(e){err.textContent='注册失败，请重试';return}
   me=n;coin=0;
   try{localStorage.setItem(LK,n);localStorage.setItem(NK,'1')}catch(e2){}
   locked=true;
   renderMain();
  });
 }
 function doLogin(){
  var n=vName(ni.value);if(!n){err.textContent='请输入用户名';return}
  if(!all[n]){err.textContent='用户名不存在，请先注册';return}
  me=n;coin=all[n].coins||0;
  try{localStorage.setItem(LK,n);localStorage.setItem(NK,'1')}catch(e){}
  locked=true;
  renderMain();
 }
 document.getElementById('br').onclick=doReg;
 document.getElementById('bl').onclick=doLogin;
 ni.onkeydown=function(e){if(e.key==='Enter')doReg()};
}

function renderMain(){
 document.getElementById('un').textContent=me+(locked?' 🔒':'');
 var r=document.getElementById('root');
 r.innerHTML=
  '<div class="bc"><div class="bi">🧱</div><div class="bn" id="bal">'+coin+'</div><div class="bl">档案币 · 15秒自动同步</div></div>'+
  '<div class="st">档案服务</div>'+
  '<div class="sv-row">'+
   '<div class="sv" id="sv0"><div class="svi">🕯</div><div class="svn">档案馆通灵</div><div class="svc">20 🧱</div><div class="svd">写下你想说的话，档案馆以它的身份与风格回应你。</div><button class="btn btn-p" id="b0">开启通灵</button></div>'+
   '<div class="sv" id="sv1"><div class="svi">📁</div><div class="svn">解锁隐藏档案</div><div class="svc">5 🧱</div><div class="svd">来自深网、废弃病历、绝密文件——真实度极高。</div><button class="btn btn-p" id="b1">解锁档案</button></div>'+
  '</div>'+
  '<div class="an"><h3>📬 获取档案币</h3><p>档案币由管理员手动发放。联系书记员，告知用户名即可充值。<br>你的用户名：<b style="color:var(--t)">'+me+'</b></p></div>';
 updSvc();
 bindSvc();
}

function updSvc(){
 var s0=document.getElementById('sv0'),s1=document.getElementById('sv1');
 var b0=document.getElementById('b0'),b1=document.getElementById('b1');
 if(!s0)return;
 if(coin>=20){s0.classList.remove('locked');b0.disabled=false}else{s0.classList.add('locked');b0.disabled=true}
 if(coin>=5){s1.classList.remove('locked');b1.disabled=false}else{s1.classList.add('locked');b1.disabled=true}
}

function bindSvc(){
 var b0=document.getElementById('b0');
 if(b0)b0.onclick=function(){
  if(coin<20){toast('🧱 余额不足');return}
  var ov=document.createElement('div');ov.className='mo';
  ov.innerHTML='<div class="mb"><div class="mx">✕</div><h3 style="text-align:center;margin-bottom:.6rem">🕯 档案馆通灵</h3><p style="font-size:.7rem;color:var(--m);text-align:center;margin-bottom:.8rem">这里的光线很暗。你说的话，档案馆会听见。</p><textarea style="width:100%;padding:.7rem;background:rgba(200,160,120,.04);border:1px solid rgba(200,160,120,.12);border-radius:8px;color:var(--t);font-family:inherit;font-size:.82rem;resize:vertical;outline:none;margin-bottom:.8rem;min-height:80px" class="stx" placeholder="你想对档案馆说什么..."></textarea><div class="sr" style="display:none;padding:.8rem;background:rgba(200,160,120,.03);border-radius:8px;color:rgba(200,160,120,.65);font-size:.82rem;line-height:1.7;min-height:60px;max-height:200px;overflow-y:auto;margin-bottom:.8rem;white-space:pre-wrap"></div><div style="display:flex;gap:.6rem"><button class="btn btn-p" style="flex:1" id="bsd">🕯 发送</button><button class="btn" style="flex:1" id="bcl">关闭</button></div></div>';
  ov.querySelector('.mx').onclick=function(){ov.remove()};
  ov.querySelector('#bcl').onclick=function(){ov.remove()};
  var done=false;
  ov.querySelector('#bsd').onclick=function(){
   if(done)return;var t=ov.querySelector('.stx').value.trim();if(!t){toast('请写下你想说的话...');return}
   done=true;ov.querySelector('.stx').disabled=true;
   spend(20,'通灵',function(ok){if(ok){coin-=20;updSvc();document.getElementById('bal').textContent=coin}});
   var rd=ov.querySelector('.sr');rd.style.display='block';var reply=getRep(t);
   var i=0,ch=reply.split('');
   var ti=setInterval(function(){if(i<ch.length){rd.innerHTML+=ch[i]==='\n'?'<br>':ch[i];i++;rd.scrollTop=rd.scrollHeight}else clearInterval(ti)},25);
   ov.querySelector('#bsd').remove();
  };
  document.body.appendChild(ov);
  setTimeout(function(){ov.querySelector('.stx').focus()},300);
 };
 var b1=document.getElementById('b1');
 if(b1)b1.onclick=function(){
  if(coin<5){toast('🧱 余额不足');return}
  var arch=getArc();
  spend(5,'解锁档案',function(ok){if(ok){coin-=5;updSvc();document.getElementById('bal').textContent=coin}});
  var ov=document.createElement('div');ov.className='mo';
  ov.innerHTML='<div class="mb"><div class="mx">✕</div><div style="text-align:center;color:#ffd700;font-size:.75rem;font-weight:600;margin-bottom:.8rem">🔓 已解锁</div><div style="text-align:center;margin-bottom:.8rem"><span style="font-size:2rem">📁</span><div style="font-size:.9rem;color:var(--t);margin:.3rem 0">'+arch.t+'</div></div><div style="display:flex;justify-content:space-between;font-size:.65rem;color:rgba(200,160,120,.2);margin-bottom:.8rem"><span>'+arch.g+'</span><span>'+arch.d+'</span></div><div style="color:rgba(200,160,120,.5);font-size:.8rem;line-height:1.7;white-space:pre-wrap">'+arch.x+'</div><div style="margin-top:.8rem;padding:.6rem;background:rgba(255,180,100,.03);border:1px solid rgba(200,160,120,.06);border-radius:6px;font-size:.65rem;color:rgba(200,160,120,.2);text-align:center">⚠ 此档案真实性未经核实</div><button class="btn btn-p" style="width:100%;margin-top:.8rem">我已阅读，关闭</button></div>';
  ov.querySelector('.mx').onclick=function(){ov.remove()};
  ov.querySelector('button.btn-p').onclick=function(){ov.remove()};
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()});
  document.body.appendChild(ov);
 };
}

// ======== INIT ========
var saved=null;
try{saved=localStorage.getItem(LK)}catch(e){}
try{locked=localStorage.getItem(NK)==='1'}catch(e){locked=false}

fUsers(function(e){
 if(e){document.getElementById('root').innerHTML='<div style="text-align:center;padding:3rem;color:var(--m)">⚠ 无法连接服务器</div>';document.getElementById('un').textContent='离线';return}
 
 // Auto-register: if localStorage has username but users.json doesn't, create it
 if(saved && !all[saved]){
  all[saved]={coins:0,transactions:[],registered_at:new Date().toISOString()};
  sUsers('自动注册: '+saved,function(ok){
   if(ok){
    me=saved;coin=0;
    if(!locked){try{localStorage.setItem(NK,'1')}catch(e){}locked=true}
    renderMain();
   }else{
    renderLogin();
   }
  });
  return;
 }
