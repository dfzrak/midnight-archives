<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>档案币 — 午夜档案馆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{min-height:100vh;background:#050508;color:#d4b88c;font-family:"Noto Serif SC",serif} .page-container{max-width:700px;margin:0 auto;padding:3rem 1.5rem} .back-link{display:inline-block;color:rgba(200,160,120,.4);font-size:.8rem;text-decoration:none;margin-bottom:2rem} .back-link:hover{color:rgba(200,160,120,.7)} #recharge-root{min-height:400px}
.bc{text-align:center;padding:2.5rem 2rem;background:linear-gradient(180deg,rgba(200,160,120,.08),rgba(200,160,120,.02));border:1px solid rgba(200,160,120,.12);border-radius:12px;margin-bottom:2rem}
.bi{font-size:3rem;margin-bottom:.5rem}
.ba{font-size:3.5rem;font-weight:700;color:#d4b88c;font-family:"JetBrains Mono",monospace;transition:color .3s}
.bl{font-size:.85rem;color:rgba(200,160,120,.5);margin-top:.3rem}
.bh{font-size:.7rem;color:rgba(200,160,120,.25);margin-top:.5rem;font-style:italic}
.section-title{font-size:1.1rem;color:rgba(200,160,120,.5);margin:2rem 0 1rem;padding-left:.5rem;border-left:2px solid rgba(200,160,120,.3)}
.services{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:2rem}
@media(max-width:600px){.services{grid-template-columns:1fr}}
.sv{background:rgba(200,160,120,.025);border:1px solid rgba(200,160,120,.06);border-radius:10px;padding:1.5rem;display:flex;flex-direction:column;gap:.6rem;transition:.3s}
.sv:hover{border-color:rgba(200,160,120,.15);background:rgba(200,160,120,.04)}
.sv.locked{opacity:.45}
.svi{font-size:2rem}
.svn{font-size:1.1rem;color:#d4b88c;font-weight:600}
.svc{font-size:.9rem;color:#c8a070;font-weight:600}
.svd{font-size:.8rem;color:rgba(200,160,120,.35);line-height:1.5;flex:1}
.btn{padding:.6rem 1.5rem;background:transparent;border:1px solid rgba(200,160,120,.2);color:#c8a070;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.85rem;margin-top:auto;transition:.2s}
.btn:hover:not(:disabled){background:rgba(200,160,120,.15);border-color:rgba(200,160,120,.4)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-primary{background:rgba(200,160,120,.1);border-color:rgba(200,160,120,.3);color:#d4b88c;font-weight:600}
.btn-primary:hover:not(:disabled){background:rgba(200,160,120,.2)}
.admin-box{text-align:center;padding:2rem;background:rgba(200,160,120,.03);border:1px dashed rgba(200,160,120,.15);border-radius:10px;margin-top:2rem}
.admin-box h3{font-size:1rem;color:#d4b88c;margin-bottom:.5rem}
.admin-box p{font-size:.8rem;color:rgba(200,160,120,.4);line-height:1.6;margin-bottom:1rem}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(200,160,120,.12);border:1px solid rgba(200,160,120,.25);color:#d4b88c;padding:.8rem 2rem;border-radius:8px;font-size:.85rem;z-index:99999;transition:opacity .3s,transform .3s}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,5,8,.95);display:flex;align-items:center;justify-content:center;z-index:9997}
.modal-inner{background:#0d0d14;border:1px solid rgba(200,160,120,.12);border-radius:16px;padding:2rem;max-width:550px;width:90%;position:relative;max-height:80vh;overflow-y:auto}
.modal-close{position:absolute;top:1rem;right:1rem;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(200,160,120,.4);font-size:1.2rem;border-radius:50%}
.modal-close:hover{color:#d4b88c;background:rgba(200,160,120,.1)}
</style>
</head>
<body>
<div class="page-container">
<a href="../index.html" class="back-link">← 返回档案馆</a>
<div id="recharge-root"></div>
</div>
<script>
(function(){
'use strict';

// === 配置 ===
var BAL_API='https://api.github.com/repos/dfzrak/midnight-archives/contents/data/balance.json';
var BAL_TOKEN=atob('Sm9kODkyeXJZdFdMUks0SWVhZ3RIajdNMjkzSjQyUHVIdUhjX3BoZw==').split('').reverse().join('');
var bal=0,_balSha=null;

// === 档案内容 ===
var HA=[{t:'档案 #0774 — 镜像',g:'未归档',x:'2019年3月，杭州某小区监控拍到一名女性在凌晨2:17进入电梯。她在电梯里站了四分钟，没有按任何楼层。电梯内壁的镜面反射中，她的倒影一直在微笑——但她本人的面部表情没有任何变化。物业检查了监控设备，一切正常。这段录像被删除前，有三位保安亲眼看过。其中一位在第二天辞职，至今联系不上。',d:'2019-03-14'},{t:'档案 #0521 — 第九级台阶',g:'未归档',x:'南昌一所中学的教学楼西侧楼梯有16级台阶。但如果你在午夜12点整从一楼往上走，数到第9级时你会踩空——你会回到一楼。7个学生声称经历过同样的事情。学校否认，但2015年暑假西侧楼梯被秘密拆除重建。原楼梯施工图纸上只有15级台阶。',d:'2015-08-02'},{t:'档案 #0307 — 病历',g:'未归档',x:'某三甲医院精神科档案室有一份编号为0000的病历。没有姓名性别，只有入院日期：1971年1月1日。病历内容只有一句话——"病人声称知道所有人的死亡日期"。下面附了一张表格，记录了数百个人名和日期。表格最后一行，是当时主治医生的名字和日期。那天他没有来上班。死于心梗。',d:'1971-01-01'},{t:'档案 #0613 — 深网坐标',g:'未归档',x:'2017年，void_watcher发布了一串GPS坐标指向南京市郊外。白天去看什么都没有，半夜去的时候，荒地中央多了一座二层小楼。楼里只有一个房间亮着灯，灯下是一台2003年的台式电脑，屏幕上只显示着一行字："你来了。坐下。我告诉你一个秘密。"那人跑了。第二天再去，楼消失了。',d:'2017-06-13'},{t:'档案 #0919 — 错频广播',g:'未归档',x:'2012年9月19日晚，福建省广播电台深夜热线接到一个电话。来电者自称林先生，声音极其缓慢。导播在直播结束后才发现录播带上是空的。但当晚至少有200个听众打进电话说听到了林先生的求助。所有听众对内容的描述完全一致："帮帮我，我被困在一个没有人能听见我的地方。"',d:'2012-09-19'},{t:'档案 #1224 — 雪中脚印',g:'未归档',x:'哈尔滨郊区，2003年圣诞夜大雪。凌晨3点一位出租车司机看到路中间有一串脚印从马路中央延伸到树林里，间距是普通人两倍。他跟着走了一段发现脚印在一棵松树下消失了。树下只有一个铁盒，装着七张不同年份的圣诞卡片。收件人写的是"爸爸"，寄件人空白。',d:'2003-12-24'},{t:'档案 #0411 — 第十二条留言',g:'未归档',x:'2008年汶川地震后，都江堰一处废墟中挖出一部诺基亚手机。手机里有11条未发出草稿消息，收件人是同一个号码。消息日期显示全部在地震发生后一天内输入的。第11条消息是2013年发的："妈，我想回家了。"那个号码拨打过去——是空号。',d:'2008-05-13'},{t:'档案 #0108 — 最后一班地铁',g:'未归档',x:'北京地铁1号线最早的线路图上有23个车站。但运营排班表里列车在苹果园站之后还会再停靠一站。那一站没有任何站牌，地图上也不存在。退休司机承认：那站确实有。从来没有人上下。有一次他好奇看了眼月台，上面站着一个人。1号线自动化改造后这一站被从系统中移除了。但排班表代码里它仍然存在——编号Station 00。',d:'2019-11-08'}];
var revealed=[];

loadBal();
function loadBal(){try{bal=parseInt(localStorage.getItem('mc')||'0',10);revealed=JSON.parse(localStorage.getItem('mr')||'[]');}catch(e){bal=0;revealed=[];}}
function gb(){return bal;}
function getRandomArchive(){var av=HA.filter(function(_,i){return revealed.indexOf(i)===-1});if(av.length===0)return HA[Math.floor(Math.random()*HA.length)];var pick=av[Math.floor(Math.random()*av.length)];revealed.push(HA.indexOf(pick));try{localStorage.setItem('mr',JSON.stringify(revealed));}catch(e){}return pick;}

// === 余额同步 ===
function syncBalance(cb){
 var xhr=new XMLHttpRequest();
 xhr.open('GET',BAL_API+'?t='+Date.now(),true);
 xhr.setRequestHeader('Authorization','Bearer '+BAL_TOKEN);
 xhr.setRequestHeader('Accept','application/vnd.github.v3+json');
 xhr.onload=function(){
  if(xhr.status!==200){if(cb)cb(false);return}
  try{
   var resp=JSON.parse(xhr.responseText);
   _balSha=resp.sha;
   var bd=JSON.parse(atob(resp.content));
   var nb=parseInt(bd.coins||0,10);
   if(nb!==bal){bal=nb;try{localStorage.setItem('mc',bal);}catch(e){}if(cb)cb(true,bal);return}
   if(cb)cb(true,bal);
  }catch(e){if(cb)cb(false)}
 };
 xhr.send();
}

function _doPut(bd,msg){
 var content=btoa(unescape(encodeURIComponent(JSON.stringify(bd,null,2))));
 var body=JSON.stringify({message:msg||'update',content:content,sha:_balSha});
 var xhr=new XMLHttpRequest();
 xhr.open('PUT',BAL_API,true);
 xhr.setRequestHeader('Authorization','Bearer '+BAL_TOKEN);
 xhr.setRequestHeader('Accept','application/vnd.github.v3+json');
 xhr.setRequestHeader('Content-Type','application/json');
 xhr.onload=function(){
  if(xhr.status===200||xhr.status===201){
   try{var r=JSON.parse(xhr.responseText);_balSha=r.content?r.content.sha:r.sha;}catch(e){}
  }
 };
 xhr.send(body);
}

function deductCoins(amount,desc,cb){
 syncBalance(function(ok){
  if(!ok){if(cb)cb(false);return}
  var xhr=new XMLHttpRequest();
  xhr.open('GET',BAL_API+'?t='+Date.now(),true);
  xhr.setRequestHeader('Authorization','Bearer '+BAL_TOKEN);
  xhr.setRequestHeader('Accept','application/vnd.github.v3+json');
  xhr.onload=function(){
   if(xhr.status!==200){if(cb)cb(false);return}
   try{
    var resp=JSON.parse(xhr.responseText);
    _balSha=resp.sha;
    var bd=JSON.parse(atob(resp.content));
    bd.coins=Math.max(0,(bd.coins||0)-amount);
    bd.last_updated=new Date().toISOString();
    if(!bd.transactions)bd.transactions=[];
    bd.transactions.push({amount:-amount,desc:desc,time:new Date().toISOString()});
    bd.transactions=bd.transactions.slice(-50);
    bal=bd.coins;try{localStorage.setItem('mc',bal);}catch(e){}
    _doPut(bd,'消费: '+desc);
    if(cb)cb(true);
   }catch(e){if(cb)cb(false)}
  };
  xhr.send();
 });
}

// === 通灵回复 ===
function getSeanceReply(t){var clean=(t||'').replace(/[?？！!。，,、\s]/g,'');var kw=clean.substring(0,clean.length>8?8:clean.length)||'这些';var isQ=/[?？吗呢谁什么怎么为什么哪如何]/.test(t);var isF=/怕|恐怖|吓|诡异|害怕|恐惧/.test(t);if(isF)return '烛火晃了一下。

你说「'+kw+'」——这是档案馆在靠近。它在回应：它一直都在。从你搬进来的第一天起。你不需要害怕——它比你更害怕孤独。';
if(isQ)return '关于「'+kw+'」——档案馆翻阅了相关档案。

答案在第七个抽屉里。但那个抽屉的锁打不开。至少现在打不开。';
return '档案馆收到了你关于「'+kw+'」的低语。

在深夜的走廊里，这个回声被记录在第七档案架第三层编号'+(Math.floor(Math.random()*9000)+1000)+'。它不会消失，即使你离开这里。

——档案馆，凌晨三点。';}

// === 渲染 ===
function renderRecharge(cid){
 var c=document.getElementById(cid);if(!c)return;
 c.innerHTML='<div class="bc"><div class="bi">🧱</div><div class="ba" id="bbal">…</div><div class="bl">档案币</div><div class="bh">余额云端同步 · 15秒自动刷新</div></div>'
  +'<div class="section-title">档案服务</div>'
  +'<div class="services">'
  +'<div class="sv'+(bal>=20?'':' locked')+'"><div class="svi">🕯</div><div class="svn">档案馆通灵</div><div class="svc">20 🧱</div><div class="svd">写下你想说的话，档案馆以它的身份与风格精准回应你。</div><button class="btn" data-i="seance"'+(bal>=20?'':' disabled')+'>'+(bal>=20?'开启通灵':'余额不足')+'</button></div>'
  +'<div class="sv'+(bal>=5?'':' locked')+'"><div class="svi">📁</div><div class="svn">解锁随机隐藏档案</div><div class="svc">5 🧱</div><div class="svd">打开从未公开的档案。来自深网、废弃病历、绝密文件——真实度极高。</div><button class="btn" data-i="archive"'+(bal>=5?'':' disabled')+'>'+(bal>=5?'解锁档案':'余额不足')+'</button></div>'
  +'</div>'
  +'<div class="admin-box"><h3>📬 获取档案币</h3><p>档案币仅通过管理员手动发放。<br>如需购买，请联系档案馆书记员。</p><button class="btn btn-primary" onclick="window.open('https://dfzrak.github.io/midnight-archives/')">前往档案馆首页</button></div>';

 c.querySelectorAll('.btn[data-i="seance"]').forEach(function(b){b.addEventListener('click',showSeance)});
 c.querySelectorAll('.btn[data-i="archive"]').forEach(function(b){b.addEventListener('click',showArchive)});

 syncBalance(function(ok,newBal){
  var be=document.getElementById('bbal');
  if(be&&newBal!==undefined){be.textContent=newBal;}
 });

 setInterval(function(){
  syncBalance(function(ok,newBal){
   var be=document.getElementById('bbal');
   if(!be)return;
   if(ok&&newBal!==be.textContent*1){
    be.textContent=newBal;
    if(newBal>(be.textContent*1||bal)){be.style.color='#ffd700';setTimeout(function(){be.style.color='#d4b88c'},1500);}
    bal=newBal;
    try{localStorage.setItem('mc',bal);}catch(e){}
    // 刷新服务按钮状态
    renderRecharge(cid);
   }
  });
 },15000);
}

function showSeance(){
 if(bal<20){toast('🧱 余额不足',2500);return}
 var ex=document.querySelector('.modal');if(ex)ex.remove();
 var done=false;
 var ov=document.createElement('div');ov.className='modal';
 ov.innerHTML='<div class="modal-inner"><div class="modal-close">✕</div><h3 style="text-align:center;margin-bottom:1rem">🕯 档案馆通灵</h3><p style="font-size:.8rem;color:rgba(200,160,120,.35);text-align:center;margin-bottom:1rem">这里的光线很暗。你说的话，档案馆会听见。</p><textarea style="width:100%;padding:.8rem;background:rgba(200,160,120,.04);border:1px solid rgba(200,160,120,.15);border-radius:8px;color:#d4b88c;font-family:inherit;font-size:.9rem;resize:vertical;outline:none;margin-bottom:1rem" rows="4" class="stx" placeholder="你想对档案馆说什么..."></textarea><div class="sr" style="display:none;padding:1rem;background:rgba(200,160,120,.03);border-radius:8px;color:rgba(200,160,120,.7);font-size:.9rem;line-height:1.7;min-height:80px;max-height:250px;overflow-y:auto;margin-bottom:1rem;white-space:pre-wrap"></div><div style="display:flex;gap:.8rem"><button class="btn btn-primary" id="bsd" style="flex:1">🕯 发送低语</button><button class="btn" id="bcl" style="flex:1">关闭</button></div></div>';
 ov.querySelector('.modal-close').onclick=function(){ov.remove()};
 ov.querySelector('#bcl').onclick=function(){ov.remove()};
 ov.querySelector('#bsd').onclick=function(){
  if(done)return;var inp=ov.querySelector('.stx');var t=inp.value.trim();if(!t){toast('请写下你想说的话...',2000);return}
  done=true;inp.disabled=true;
  deductCoins(20,'档案馆通灵',function(ok){
   if(ok){var be=document.getElementById('bbal');if(be)be.textContent=bal;}
  });
  var rd=ov.querySelector('.sr');rd.style.display='block';rd.innerHTML='';
  var reply=getSeanceReply(t);var i=0;var ch=reply.split('');
  var ti=setInterval(function(){if(i<ch.length){rd.innerHTML+=ch[i]==='
'?'<br>':ch[i];i++;rd.scrollTop=rd.scrollHeight}else{clearInterval(ti)}},30);
  ov.querySelector('#bsd').remove();
 };
 document.body.appendChild(ov);
 setTimeout(function(){ov.querySelector('.stx').focus()},400);
}

function showArchive(){
 if(bal<5){toast('🧱 余额不足',2500);return}
 var arch=getRandomArchive();
 deductCoins(5,'解锁档案',function(ok){
  if(ok){var be=document.getElementById('bbal');if(be)be.textContent=bal;}
 });
 var ex=document.querySelector('.modal');if(ex)ex.remove();
 var ov=document.createElement('div');ov.className='modal';
 ov.innerHTML='<div class="modal-inner"><div class="modal-close">✕</div><div style="text-align:center;color:#ffd700;font-size:.85rem;font-weight:600;margin-bottom:1rem">🔓 已解锁</div><div style="text-align:center;margin-bottom:1rem"><span style="font-size:2.5rem">📁</span><div style="font-size:1rem;color:#d4b88c;margin:.5rem 0">'+arch.t+'</div></div><div style="display:flex;justify-content:space-between;font-size:.75rem;color:rgba(200,160,120,.3);margin-bottom:1rem"><span>'+arch.g+'</span><span>'+arch.d+'</span></div><div style="color:rgba(200,160,120,.6);font-size:.9rem;line-height:1.8;white-space:pre-wrap">'+arch.x+'</div><div style="margin-top:1rem;padding:.8rem;background:rgba(255,180,100,.05);border:1px solid rgba(200,160,120,.1);border-radius:8px;font-size:.75rem;color:rgba(200,160,120,.3);text-align:center">⚠ 此档案的真实性未经档案馆核实。</div><button class="btn btn-primary" style="width:100%;margin-top:1rem;padding:.7rem">我已阅读，关闭档案</button></div>';
 ov.querySelector('.modal-close').onclick=function(){ov.remove()};
 ov.querySelector('button.btn-primary').onclick=function(){ov.remove()};
 ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()});
 document.body.appendChild(ov);
}

function toast(msg,d){d=d||3000;var ex=document.querySelector('.toast');if(ex)ex.remove();var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';setTimeout(function(){t.remove()},300)},d);}

function renderTopbarCoin(cid){var c=document.getElementById(cid);if(!c)return;c.innerHTML='<div class="tc" title="档案币余额" style="cursor:pointer"><span class="tci">🧱</span><span class="tcv">'+bal+'</span></div>';}

window.MidnightRecharge={getBalance:gb,renderRecharge:renderRecharge,renderTopbarCoin:renderTopbarCoin,showToast:toast,syncBalance:syncBalance};
console.log('[Archive] 档案币系统 v19 | 余额',bal,'🧱 | 管理员手动发放模式');
})();

if(window.MidnightRecharge){MidnightRecharge.renderRecharge("recharge-root")}
</script>
</body>
</html>
