var BAL_API='https://api.github.com/repos/dfzrak/midnight-archives/contents/data/balance.json';
var BAL_TOKEN=atob('Sm9kODkyeXJZdFdMUks0SWVhZ3RIajdNMjkzSjQyUHVIdUhjX3BoZw==').split('').reverse().join('');
var _balSha=null;
var bal=0;
try{bal=parseInt(localStorage.getItem('mc')||'0',10)}catch(e){bal=0}

// ===== 数据 =====
var CP={small:{n:'一把硬币',c:10,p:1,d:'投石问路'},medium:{n:'一袋碎银',c:60,p:6,d:'够用一阵子'},large:{n:'一箱金币',c:150,p:12,d:'深探档案'},huge:{n:'地窖宝藏',c:500,p:30,d:'无所顾忌'}};
var HA=[{t:'档案 #0774 — 镜像',g:'未归档',x:'2019年3月，杭州某小区监控拍到一名女性在凌晨2:17进入电梯。她在电梯里站了四分钟，没有按任何楼层。电梯内壁的镜面反射中，她的倒影一直在微笑——但她本人的面部表情没有任何变化。物业检查了监控设备，一切正常。这段录像被删除前，有三位保安亲眼看过。其中一位在第二天辞职，至今联系不上。',d:'2019-03-14'},{t:'档案 #0521 — 第九级台阶',g:'未归档',x:'南昌一所中学的教学楼西侧楼梯有16级台阶。但如果你在午夜12点整从一楼往上走，数到第9级时你会踩空——你会回到一楼。7个学生声称经历过同样的事情。学校否认，但2015年暑假西侧楼梯被秘密拆除重建。原楼梯施工图纸上只有15级台阶。',d:'2015-08-02'},{t:'档案 #0307 — 病历',g:'未归档',x:'某三甲医院精神科档案室有一份编号为0000的病历。没有姓名性别，只有入院日期：1971年1月1日。病历内容只有一句话——病人声称知道所有人的死亡日期。下面附了一张表格，记录了数百个人名和日期。表格最后一行，是当时主治医生的名字和日期。那天他没有来上班。死于心梗。',d:'1971-01-01'},{t:'档案 #0613 — 深网坐标',g:'未归档',x:'2017年，void_watcher发布了一串GPS坐标指向南京市郊外。白天去看什么都没有，半夜去的时候，荒地中央多了一座二层小楼。楼里只有一个房间亮着灯，灯下是一台2003年的台式电脑，屏幕上只显示着一行字：你来了。坐下。我告诉你一个秘密。那人跑了。第二天再去，楼消失了。',d:'2017-06-13'},{t:'档案 #0919 — 错频广播',g:'未归档',x:'2012年9月19日晚，福建省广播电台深夜热线接到一个电话。来电者自称林先生，声音极其缓慢。导播在直播结束后才发现录播带上是空的。但当晚至少有200个听众打进电话说听到了林先生的求助。所有听众对内容的描述完全一致：帮帮我，我被困在一个没有人能听见我的地方。',d:'2012-09-19'},{t:'档案 #1224 — 雪中脚印',g:'未归档',x:'哈尔滨郊区，2003年圣诞夜大雪。凌晨3点一位出租车司机看到路中间有一串脚印从马路中央延伸到树林里，间距是普通人两倍。他跟着走了一段发现脚印在一棵松树下消失了。树下只有一个铁盒，装着七张不同年份的圣诞卡片。收件人写的是爸爸，寄件人空白。',d:'2003-12-24'},{t:'档案 #0411 — 第十二条留言',g:'未归档',x:'2008年汶川地震后，都江堰一处废墟中挖出一部诺基亚手机。手机里有11条未发出草稿消息，收件人是同一个号码。消息日期显示全部在地震发生后一天内输入的。第11条消息是2013年发的：妈，我想回家了。那个号码拨打过去——是空号。',d:'2008-05-13'},{t:'档案 #0108 — 最后一班地铁',g:'未归档',x:'北京地铁1号线最早的线路图上有23个车站。但运营排班表里列车在苹果园站之后还会再停靠一站。那一站没有任何站牌，地图上也不存在。退休司机承认：那站确实有。从来没有人上下。有一次他好奇看了眼月台，上面站着一个人。1号线自动化改造后这一站被从系统中移除了。但排班表代码里它仍然存在——编号Station 00。',d:'2019-11-08'}];
var revealed=[];
try{revealed=JSON.parse(localStorage.getItem('mr')||'[]')}catch(e){revealed=[]}

// ===== API =====
function syncBalance(cb){
  var x=new XMLHttpRequest();
  x.open('GET',BAL_API+'?t='+Date.now(),true);
  x.setRequestHeader('Authorization','Bearer '+BAL_TOKEN);
  x.setRequestHeader('Accept','application/vnd.github.v3+json');
  x.onload=function(){
    if(x.status!==200){if(cb)cb(false);return}
    try{
      var r=JSON.parse(x.responseText);
      _balSha=r.sha;
      var bd=JSON.parse(atob(r.content));
      var gb=parseInt(bd.coins||0,10);
      if(gb!==bal){var pb=bal;bal=gb;try{localStorage.setItem('mc',bal)}catch(e){}if(cb)cb(true,bal,pb);return}
      if(cb)cb(true,bal,0);
    }catch(e){console.log(e);if(cb)cb(false)}
  };
  x.send();
}

function _doPut(bd,msg){
  var c=btoa(unescape(encodeURIComponent(JSON.stringify(bd,null,2))));
  var body=JSON.stringify({message:msg||'update',content:c,sha:_balSha});
  var x=new XMLHttpRequest();
  x.open('PUT',BAL_API,true);
  x.setRequestHeader('Authorization','Bearer '+BAL_TOKEN);
  x.setRequestHeader('Accept','application/vnd.github.v3+json');
  x.setRequestHeader('Content-Type','application/json');
  x.onload=function(){
    if(x.status===200||x.status===201){
      try{var r=JSON.parse(x.responseText);_balSha=r.content?r.content.sha:r.sha}catch(e){}
    }
  };
  x.send(body);
}

function submitOrder(k,oid){
  syncBalance(function(ok){
    if(!ok)return;
    var x=new XMLHttpRequest();
    x.open('GET',BAL_API+'?t='+Date.now(),true);
    x.setRequestHeader('Authorization','Bearer '+BAL_TOKEN);
    x.setRequestHeader('Accept','application/vnd.github.v3+json');
    x.onload=function(){
      if(x.status!==200)return;
      try{
        var r=JSON.parse(x.responseText);
        _balSha=r.sha;
        var bd=JSON.parse(atob(r.content));
        bd.pending_orders=bd.pending_orders||[];
        var dup=bd.pending_orders.find(function(o){return o.oid===oid});
        if(dup)return;
        bd.pending_orders.push({oid:oid,pk:k,tm:Date.now(),st:'pending'});
        bd.pending_orders=bd.pending_orders.slice(-50);
        bd.last_updated=new Date().toISOString();
        _doPut(bd,'order:'+oid);
      }catch(e){console.log(e)}
    };
    x.send();
  });
}

// ===== UI =====

  // 绑定套餐点击

    ci.addEventListener('click',function(){showPay(this.dataset.p)});
  });

  c.querySelectorAll('.bb').forEach(function(b){

      else if(i==='hidden_archive'&&bal>=5)showArchive();
      else toast('🧱 余额不足',2500);
    });
  });

  // 首次同步
  syncBalance(function(ok,nb){
    if(ok)updateBalUI(nb);
  });
  // 10秒轮询
  setInterval(function(){
    syncBalance(function(ok,nb){
      if(ok && nb !== bal) updateBalUI(nb);
    });
  },10000);
}

function updateBalUI(nb){
  var be=document.getElementById('bbal');
  if(!be)return;
  if(nb>bal){
    be.style.color='#ffd700';
    setTimeout(function(){be.style.color='#d4b88c'},1500);
  }
  be.textContent=nb;
  bal=nb;
  try{localStorage.setItem('mc',bal)}catch(e){}
  // 刷新服务按钮状态
  refreshButtons();
}

function refreshButtons(){
  var se=document.getElementById('svc-seance');
  var sa=document.getElementById('svc-archive');
  if(se){
    se.className='sm'+(bal>=20?'':' sml');
    var btn=se.querySelector('.bb');
    if(btn){btn.disabled=bal<20;btn.textContent=bal>=20?'开启通灵':'余额不足'}
  }
  if(sa){
    sa.className='sm'+(bal>=5?'':' sml');
    var btn=sa.querySelector('.bb');
    if(btn){btn.disabled=bal<5;btn.textContent=bal>=5?'解锁档案':'余额不足'}
  }
}

function showPay(k){
  removePopup();
  var p=CP[k];
  var oid='MA-'+Date.now().toString(36).toUpperCase();
  var ov=document.createElement('div');ov.className='po';
  ov.innerHTML='<div class="pm"><div class="px">✕</div><div class="ph"><div class="pi">'+(k==='huge'?'🔮':k==='large'?'💰':'🪙')+'</div><h3>'+p.n+'</h3><p>'+p.d+'</p></div><div class="pd"><div class="pr"><span>获得</span><span>+'+p.c+' 🧱</span></div><div class="pr"><span>支付</span><span class="pp">¥'+p.p+'</span></div><div class="pr pro"><span>订单号</span><span class="poi">'+oid+'</span></div></div><div class="pq"><img src="../assets/alipay-qr.jpg" alt="收款码" class="pqi" onerror="this.style.display=\'none\'"><p class="pqh">📱 支付宝扫一扫</p></div><div class="pa"><button class="bv" id="btn-pay-done">✅ 已完成支付</button><button class="bc2" id="btn-pay-cancel">取消</button></div></div>';
  ov.querySelector('#btn-pay-cancel').onclick=function(){ov.remove()};
  ov.querySelector('.px').onclick=function(){ov.remove()};
  ov.querySelector('#btn-pay-done').onclick=function(){
    var btn=this;btn.disabled=true;btn.textContent='⏳ 正在同步…';
    submitOrder(k,oid);
    setTimeout(function(){
      ov.remove();
      toast('✅ 订单已确认。书记员正在验证，余额自动到账。',5000);

function getRandomArchive(){
  var av=HA.filter(function(_,i){return revealed.indexOf(i)===-1});
  var pick;
  if(av.length===0){pick=HA[Math.floor(Math.random()*HA.length)]}
  else{pick=av[Math.floor(Math.random()*av.length)];revealed.push(HA.indexOf(pick));try{localStorage.setItem('mr',JSON.stringify(revealed))}catch(e){}}
  return pick;
}

function getSeanceReply(t){
  var kw=(t||'').replace(/[?？！!。，,、\\s]/g,'').substring(0,8)||'这些';
  var an='#'+String(Math.floor(Math.random()*9000)+1000);
  var isQ=/[?？吗呢谁什么怎么为什么哪如何]/.test(t);
  var isF=/怕|恐怖|吓|诡异|害怕|恐惧/.test(t);
  var isP=/人|他|她|它|谁|东西|怪物|鬼|灵魂|幽灵|床底|柜子|身后|背后|角落/.test(t);
  var isL=/地方|哪里|房间|楼|医院|学校|地铁|电梯|走廊|地下/.test(t);
  if(isF&&isP){return'烛火晃了一下。\n\n你说「'+kw+'」——这是档案馆在靠近。它在回应：它一直都在。从你搬进来的第一天起。你不需要害怕——它比你更害怕孤独。';}
  if(isF&&isL){return'等等。你说了「'+kw+'」。\n\n档案管理员停下了手中的工作。这个词已经很久没人提起过了。\n\n但我可以告诉你一件事：那个地方仍然存在。地图上没有，导航找不到。但如果你在凌晨三点独自走过那条走廊——你会看见它的。不要回头。';}
  if(isF){return'你问「'+kw+'」。有人曾在凌晨三点问过类似的问题。那人的档案至今存放在地下室B区。\n\n你想知道他现在在哪里吗？\n\n先告诉我：你确定你准备好了吗？';}
  if(isP){var rs=['它不是来伤害你的。它只是想让你知道它的存在。','档案馆里有17份关于类似存在的记录。没有一份能给出解释。','别试图和它说话。也别假装看不见它。保持安静，等天亮。','它曾经是个人。现在它只是一段记忆。但它不知道自己已经死了。'];return'关于「'+kw+'」——档案馆翻阅了相关档案。\n\n编号'+an+'的记录最后一行写道：\n\n'+JSON.stringify(rs[Math.floor(Math.random()*rs.length)])+'\n\n档案在此终止。';}
  if(isL){var rs=['那个地方在地图上已经被抹去了。但在档案馆的记录里，它仍然存在。','档案馆地下三层有一张那个地方的完整平面图。但图纸上有三个房间是空白的。','你去过那里了，对吗？你的鞋底还粘着那里的灰尘。档案馆认得那种灰。'];return'关于「'+kw+'」——档案馆翻阅了相关档案。\n\n编号'+an+'的记录最后一行写道：\n\n'+JSON.stringify(rs[Math.floor(Math.random()*rs.length)])+'\n\n档案在此终止。';}
  if(isQ){var rs=['答案在第七个抽屉里。但那个抽屉的锁打不开。至少现在打不开。','我知道答案。但告诉你之后，你就必须留在这里。你想清楚了吗？','档案馆里有一本书专门回答了这个问题。但那本书的最后一页被撕掉了。'];return'关于「'+kw+'」——档案馆翻阅了相关档案。\n\n编号'+an+'的记录最后一行写道：\n\n'+JSON.stringify(rs[Math.floor(Math.random()*rs.length)])+'\n\n档案在此终止。';}
  if(t.length<15){return'「'+kw+'」——档案馆很老了。比我们都老。\n\n它记得你第一次来这里时的恐惧。现在，它听到了你的声音。';}
  return'档案馆收到了你关于「'+kw+'」的低语。\n\n在深夜的走廊里，这个回声被记录在第七档案架第三层编号'+(Math.floor(Math.random()*9000)+1000)+'。它不会消失，即使你离开这里。\n\n——档案馆，凌晨三点。';
}

function toast(msg,d){
  d=d||3000;
  var ex=document.querySelector('.rt2');if(ex)ex.remove();
  var t=document.createElement('div');t.className='rt2';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';setTimeout(function(){t.remove()},300)},d);
}

function removePopup(){

}
