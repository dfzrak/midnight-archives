<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>档案币充值 — 午夜档案馆</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <script src="../shared_data.js?v=4"></script>
  <script src="../_config.js?v=2"></script>
  <script src="../ai/ai_agent.js"></script>
  <script src="../ai/recharge.js?v=9"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #050508;
      color: var(--brand-foreground);
      font-family: var(--font-sans);
    }
    .page-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    .back-link {
      display: inline-block;
      color: rgba(200,160,120,0.4);
      font-size: 0.8rem;
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: rgba(200,160,120,0.7); }
    #recharge-root { min-height: 400px; }
  </style>
</head>
<body>
  <div class="page-container">
    <a href="../index.html" class="back-link">← 返回档案馆</a>
    <div id="recharge-root"></div>
  </div>

  <script>
    // === 动态加载，绕过 CDN 缓存 ===
    (function() {
      var ts = '?v=9&t=' + Date.now();
      var s = document.createElement('script');
      s.src = '../ai/recharge.js' + ts;
      s.onload = function() {
        if (window.MidnightRecharge) {
          MidnightRecharge.renderRecharge('recharge-root');
        }
      };
      s.onerror = function() {
        document.getElementById('recharge-root').innerHTML =
          '<p style="color:rgba(200,160,120,0.4);text-align:center;padding:4rem 0;">⚠ 档案馆信号中断，请稍后刷新重试</p>';
      };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
