<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — 午夜档案馆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--brand-background, #0a0a0c);
      color: var(--neutral-300, #c8c8c8);
      font-family: var(--font-display, 'Noto Serif SC', serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .error-container {
      text-align: center;
      padding: 40px;
      max-width: 500px;
    }
    .error-code {
      font-size: 120px;
      font-weight: 700;
      color: #8b0000;
      text-shadow: 0 0 40px rgba(139,0,0,0.3), 0 0 80px rgba(139,0,0,0.1);
      letter-spacing: 20px;
      margin-bottom: 20px;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; text-shadow: 0 0 60px rgba(139,0,0,0.5), 0 0 120px rgba(139,0,0,0.2); }
    }
    .error-title {
      font-size: 18px;
      color: rgba(200,200,200,0.6);
      margin-bottom: 30px;
      letter-spacing: 6px;
    }
    .error-message {
      font-size: 13px;
      color: rgba(200,200,200,0.35);
      line-height: 2;
      margin-bottom: 40px;
    }
    .error-link {
      display: inline-block;
      padding: 12px 32px;
      background: transparent;
      border: 1px solid var(--brand-primary-faint, rgba(139,0,0,0.3));
      color: var(--neutral-400, rgba(200,200,200,0.6));
      text-decoration: none;
      font-family: var(--font-display, 'Noto Serif SC', serif);
      font-size: 13px;
      letter-spacing: 3px;
      border-radius: var(--radius-md, 4px);
      transition: all 0.3s ease;
    }
    .error-link:hover {
      border-color: var(--brand-primary, rgba(139,0,0,0.6));
      color: var(--neutral-200, rgba(200,200,200,0.9));
      box-shadow: 0 0 20px var(--brand-glow, rgba(139,0,0,0.15));
    }
    .scanlines::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
      pointer-events: none;
      z-index: 9998;
    }
  </style>
</head>
<body class="scanlines">
  <div class="error-container">
    <div class="error-code">404</div>
    <div class="error-title">档 案 丢 失</div>
    <div class="error-message">
      您请求的档案不存在或已被归档。<br>
      它可能从未存在过，也可能只是暂时消失。<br>
      请不要试图寻找它。
    </div>
    <a href="pages/forum.html" class="error-link">返回档案馆</a>
  </div>
</body>
</html>
